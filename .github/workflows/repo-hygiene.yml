name: repo-hygiene

on:
  pull_request:
  push:
    branches:
      - main
      - 'fix/**'
      - 'feat/**'
      - 'chore/**'

jobs:
  check-tracked-artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run repository hygiene guard
        run: python scripts/check_repo_hygiene.py
